# Frontend static site. Points at the live FastAPI service.
services:
  - type: web
    name: astra-med-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_USE_MOCK
        value: "false"
      # Must be the public HTTPS origin of astra-med-api (no trailing slash, no /api)
      - key: VITE_API_BASE_URL
        value: "https://astra-monitor.onrender.com"
