# Render Web Service for the FastAPI API (and optional bundled frontend_dist).
services:
  - type: web
    name: astra-med-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        # Prefer your exact frontend origin(s). "*" works for demos.
        value: "*"
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Required for camera observe / sleep-watch / mission chat (xAI Grok)
      - key: XAI_API_KEY
        sync: false
      - key: GROK_MODEL
        value: "grok-4.7"
      - key: CREW_NAME
        value: "Sim Crew A"
      - key: MISSION_DAY
        value: "42"
      - key: NASA_CACHE_TTL_SECONDS
        value: "900"
