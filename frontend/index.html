<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05080e" />
    <meta name="description" content="ASTRA-MED workspace and interactive Earth view." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preload" as="image" href="/textures/earth-day.png" />
    <title>ASTRA MED</title>
    <style>
      #rocket-boot {
        position: fixed;
        inset: 0;
        z-index: 100000;
        background: #02060f;
        transition: opacity .2s linear;
      }
      #rocket-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #rocket-boot .copy {
        position: absolute;
        left: 50%;
        top: 6%;
        transform: translateX(-50%);
        text-align: center;
        color: #eef5fb;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        font-size: clamp(12px, 1.6vw, 15px);
        text-shadow: 0 2px 16px #000c;
        pointer-events: none;
        white-space: nowrap;
      }
      #rocket-boot .copy small {
        display: block;
        margin-top: 8px;
        font-size: 10px;
        letter-spacing: 1.4px;
        color: #9fb4c7;
        text-transform: none;
      }
      #rocket-skip {
        position: absolute;
        right: 24px;
        bottom: 24px;
        z-index: 2;
        border: 1px solid #d5e4f088;
        background: #05080ecc;
        color: #f2f6fa;
        border-radius: 6px;
        padding: 11px 16px;
        font-size: 13px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="rocket-boot" role="dialog" aria-modal="true" aria-label="3D rocket launching into space">
      <canvas id="rocket-canvas"></canvas>
      <p class="copy">Launch sequence<small>Leaving Earth</small></p>
      <button type="button" id="rocket-skip">Skip</button>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
